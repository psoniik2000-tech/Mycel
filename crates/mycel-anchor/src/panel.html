<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mycel сервер</title>
<style>
  :root { --bg: #17212b; --card: #1f2c3a; --text: #e8edf2; --muted: #8a9aa9; --accent: #f0a030; --bad: #e05555; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; margin: 8px 0 16px; }
  h2 { font-size: 16px; margin: 0 0 10px; }
  section { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .grid { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; }
  .grid span:nth-child(odd) { color: var(--muted); }
  code { word-break: break-all; }
  button { background: var(--accent); color: #1a1a1a; border: 0; border-radius: 8px; padding: 8px 14px; font: inherit; cursor: pointer; }
  button.ghost { background: transparent; color: var(--bad); padding: 4px 8px; }
  input { background: var(--bg); color: var(--text); border: 1px solid #334; border-radius: 8px; padding: 8px; font: inherit; }
  label { margin-right: 10px; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 6px 4px; border-top: 1px solid #2b3a4a; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .muted { color: var(--muted); }
  #msg { min-height: 1.5em; color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Mycel — главный сервер</h1>
  <div id="msg"></div>
  <section>
    <h2>Состояние</h2>
    <div class="grid" id="status"></div>
  </section>
  <section>
    <h2>Обновление</h2>
    <div class="row"><span id="upd" class="muted">Проверяю…</span><button id="updBtn" hidden>Обновить</button></div>
  </section>
  <section>
    <h2>Доступ</h2>
    <p class="muted" id="openNote"></p>
    <table id="allow"></table>
    <div class="row" style="margin-top:10px">
      <input id="who" placeholder="@ник или ключ" size="28">
      <label><input type="checkbox" value="dir" checked> имя</label>
      <label><input type="checkbox" value="box" checked> почта</label>
      <label><input type="checkbox" value="files" checked> файлы</label>
      <button id="add">Разрешить</button>
    </div>
  </section>
  <section>
    <h2>Резервная копия</h2>
    <p class="muted">Каталог имён, его ключ и список доступа одним файлом. Восстановление: <code>mycel-server restore файл</code> при остановленном сервере.</p>
    <button id="backup">Скачать</button>
  </section>
</main>
<script>
const H = { "x-mycel": "1" };
const $ = (id) => document.getElementById(id);
const say = (t) => { $("msg").textContent = t; };
async function call(method, path, body) {
  const r = await fetch(path, { method, headers: H, body });
  if (!r.ok) throw new Error(await r.text());
  return r;
}
const gb = (b) => b > 1e9 ? (b / 1e9).toFixed(2) + " ГБ" : (b / 1e6).toFixed(1) + " МБ";
const up = (s) => { const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60); return (d ? d + " д " : "") + h + " ч " + m + " мин"; };
const ROLE = { dir: "имя", box: "почта", files: "файлы" };
async function load() {
  const s = await (await call("GET", "/api/status")).json();
  const rows = [["Версия", s.version], ["Адрес", s.url], ["Ссылка сервера", s.url + "#" + s.id], ["Работает", up(s.uptime)],
    ["Push-уведомления", s.push ? "включены" : "выключены (нет fcm.json)"], ["Имён в каталоге", s.names], ["Данные", gb(s.bytes) + " — " + s.dir]];
  $("status").replaceChildren(...rows.flatMap(([k, v]) => { const a = document.createElement("span"), b = document.createElement("span"); a.textContent = k; b.innerHTML = ""; const c = document.createElement("code"); c.textContent = v; b.append(c); return [a, b]; }));
  $("openNote").textContent = s.allow.length ? "Сервер закрыт: пользоваться могут только эти аккаунты." : "Список пуст — сервер открыт для всех. Добавьте кого-нибудь, чтобы закрыть.";
  $("allow").replaceChildren(...s.allow.map((e) => {
    const tr = document.createElement("tr"), a = document.createElement("td"), b = document.createElement("td"), c = document.createElement("td");
    a.innerHTML = "<code></code>"; a.firstChild.textContent = e.who;
    b.textContent = (e.roles.length ? e.roles : ["dir", "box", "files"]).map((r) => ROLE[r] || r).join(", "); b.className = "muted";
    const x = document.createElement("button"); x.className = "ghost"; x.textContent = "Убрать";
    x.onclick = async () => { await call("POST", "/api/deny", e.who); load(); };
    c.append(x); tr.append(a, b, c); return tr;
  }));
}
async function checkUpdate() {
  try {
    const v = await (await call("GET", "/api/update")).json();
    $("upd").textContent = v ? "Доступна версия " + v : "Установлена последняя версия";
    $("updBtn").hidden = !v;
  } catch (e) { $("upd").textContent = "Не удалось проверить: " + e.message; }
}
$("updBtn").onclick = async () => {
  try {
    await call("POST", "/api/update");
    say("Обновляюсь, сервер перезапустится. Страница обновится сама.");
    setTimeout(() => location.reload(), 15000);
  } catch (e) { say(e.message); }
};
$("add").onclick = async () => {
  const who = $("who").value.trim();
  if (!who) return;
  const roles = [...document.querySelectorAll("input[type=checkbox]:checked")].map((c) => c.value);
  try { await call("POST", "/api/allow", [who, ...(roles.length === 3 ? [] : roles)].join(" ")); $("who").value = ""; say("Добавлен"); load(); }
  catch (e) { say(e.message); }
};
$("backup").onclick = async () => {
  try {
    const b = await (await call("GET", "/api/backup")).blob();
    const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "mycel-server-backup.bin"; a.click();
  } catch (e) { say(e.message); }
};
load().catch((e) => say(e.message));
checkUpdate();
setInterval(() => load().catch(() => {}), 10000);
</script>
</body>
</html>
