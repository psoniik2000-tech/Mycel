[package]
name = "mycel-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mycel-proto.workspace = true
mycel-crypto.workspace = true
mycel-store.workspace = true
mycel-net.workspace = true
postcard.workspace = true
tokio.workspace = true
anyhow.workspace = true
getrandom = { version = "0.3", features = ["std"] }
data-encoding = "2"
mycel-media = { path = "../mycel-media" }
iroh-blobs = { version = "0.104", default-features = false, features = ["fs-store"] }
n0-future = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
webpki-roots = "1"
argon2 = "0.6"
chacha20poly1305 = { version = "0.10", features = ["stream"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
iroh-relay.workspace = true

[dev-dependencies]
tempfile = "3"
