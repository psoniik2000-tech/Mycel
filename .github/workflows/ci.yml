name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude mycel-app --all-targets -- -D warnings
      - run: cargo test --workspace --exclude mycel-app

  app:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/mycel-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/mycel-app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run build
      - run: cargo clippy -p mycel-app -- -D warnings

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mycel-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/mycel-app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - run: npm ci
      # Release key from secrets if set; otherwise the APK is debug-signed (still installs on phones).
      - name: Signing key
        env:
          KEY: ${{ secrets.ANDROID_KEY_BASE64 }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.KEY != ''
        run: |
          echo "$KEY" | base64 -d > $RUNNER_TEMP/mycel.jks
          printf 'storeFile=%s\nkeyAlias=%s\npassword=%s\n' "$RUNNER_TEMP/mycel.jks" "$ALIAS" "$PASS" > src-tauri/gen/android/keystore.properties
      - run: npx tauri android build --apk --target aarch64 armv7
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
      - uses: actions/upload-artifact@v4
        with:
          name: mycel-android-apk
          path: apps/mycel-app/src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
