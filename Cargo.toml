[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
mycel-proto = { path = "crates/mycel-proto" }
mycel-crypto = { path = "crates/mycel-crypto" }
mycel-store = { path = "crates/mycel-store" }
mycel-net = { path = "crates/mycel-net" }
mycel-core = { path = "crates/mycel-core" }
iroh = "1.4.1"
iroh-base = { version = "1.4.1", features = ["key"] }
iroh-tickets = "1"
postcard = { version = "1", features = ["alloc"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-std", "io-util"] }
anyhow = "1"
